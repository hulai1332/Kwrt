name: Build JDCloud RE-SS-01 Clean

on:
  workflow_dispatch:
  push:
    branches:
      - 25.12
    paths:
      - '.github/workflows/Build-JDCloud-RE-SS-01.yml'
      - 'devices/qualcommax_ipq60xx/diy.sh'

permissions:
  contents: read

jobs:
  build:
    name: JDCloud RE-SS-01 / clean
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kwrt
        uses: actions/checkout@v4
        with:
          ref: 25.12
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache \
            rename libelf-dev device-tree-compiler libgmp-dev libmpc-dev \
            libfuse-dev

      - name: Clone OpenWrt 25.12 source
        run: |
          git clone --depth=1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

      - name: Prepare Kwrt Qualcomm/NSS source tree
        working-directory: openwrt
        run: |
          set -eux
          cp -rf ../devices/qualcommax_ipq60xx/. ./device-config

          git_clone_path() {
            trap 'rm -rf "$tmpdir"' RETURN
            branch="$1"; rurl="$2"; mv_mode="$3"
            if [ "$mv_mode" = "mv" ]; then shift 3; else shift 2; fi
            rootdir="$PWD"
            tmpdir="$(mktemp -d)"
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              (cd "$tmpdir" && git checkout "$branch")
            fi
            cd "$tmpdir"
            git sparse-checkout init --cone
            git sparse-checkout set "$@"
            if [ "$mv_mode" != "mv" ]; then
              cp -rn ./* "$rootdir"/
            else
              for p in "$@"; do
                mkdir -p "$rootdir/$p"
                cp -rn "$p"/* "$rootdir/$p"/ || true
              done
            fi
            cd "$rootdir"
          }
          export -f git_clone_path

          chmod +x ../devices/qualcommax_ipq60xx/diy.sh
          /bin/bash ../devices/qualcommax_ipq60xx/diy.sh

      - name: Verify RE-SS-01 eMMC upgrade implementation
        working-directory: openwrt
        run: |
          set -eux
          PLATFORM="target/linux/qualcommax/ipq60xx/base-files/lib/upgrade/platform.sh"
          test -f files/lib/upgrade/emmc.sh
          grep -q 'emmc_do_upgrade' files/lib/upgrade/emmc.sh
          grep -q '^\s*jdcloud,re-ss-01)' "$PLATFORM"

          python3 - "$PLATFORM" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          start = re.search(r'(?m)^\s*jdcloud,re-ss-01\)\s*$', text)
          if not start:
              raise SystemExit('ERROR: JDCloud eMMC block not found')
          end = re.search(r'(?m)^\s*;;\s*$', text[start.end():])
          if not end:
              raise SystemExit('ERROR: JDCloud eMMC block terminator not found')
          block = text[start.start():start.end() + end.end()]
          required = (
              'CI_KERNPART="0:HLOS_1"',
              'CI_ROOTPART="rootfs_1"',
              'CI_KERNPART="0:HLOS"',
              'CI_ROOTPART="rootfs"',
              'emmc_do_upgrade "$1"',
          )
          for needle in required:
              if needle not in block:
                  raise SystemExit(f'ERROR: missing {needle}')
          if re.search(r'(?m)^\s*mmc_do_upgrade "\$1"', block):
              raise SystemExit('ERROR: stale mmc_do_upgrade handler remains in JDCloud block')
          print('RE-SS-01 eMMC upgrade handler: OK')
          PY
          echo 'emmc.sh: OK'

      - name: Configure clean JDCloud RE-SS-01
        working-directory: openwrt
        run: |
          set -eux
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_ALL_PROFILES=n

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_LUCI_LANG_en=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_zoneinfo-asia=y
          EOF
          make defconfig

      - name: Set LAN address to 192.168.20.1
        working-directory: openwrt
        run: |
          set -eux
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-jdcloud-re-ss-01-clean <<'EOF'
          #!/bin/sh
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.20.1'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network
          uci set system.@system[0].hostname='JDCloud-AX1800-Pro'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci set system.@system[0].timezone='CST-8'
          uci commit system
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-jdcloud-re-ss-01-clean

      - name: Verify clean profile
        working-directory: openwrt
        run: |
          set -eux
          grep 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config
          if grep -E '^CONFIG_PACKAGE_luci-app-[^=]+=(y|m)$' .config; then
            echo 'ERROR: optional luci-app selected'
            exit 1
          fi
          if grep -E '^CONFIG_PACKAGE_(xray-core|sing-box|hysteria)=(y|m)$' .config; then
            echo 'ERROR: proxy core selected'
            exit 1
          fi

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Compile firmware
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Verify generated sysupgrade image
        working-directory: openwrt
        run: |
          set -eux
          IMG="$(find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*jdcloud_re-ss-01-squashfs-sysupgrade.bin' | head -n1)"
          test -n "$IMG"
          tar tf "$IMG" | grep -q '/kernel$'
          tar tf "$IMG" | grep -q '/root$'
          echo "Verified sysupgrade image: $IMG"

      - name: Show firmware files
        run: find openwrt/bin/targets/qualcommax/ipq60xx -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-RE-SS-01-clean
          path: openwrt/bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 14
